name: Deploy to Production

on:
  push:
    branches:
      - main

env:
  NODE_BIN: /root/.nvm/versions/node/v24.14.0/bin

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: NODE_BIN
          script: |
            set -e
            export PATH="$NODE_BIN:$PATH"
            cd /var/www/vietnam-moto-tours
            git checkout -- .
            git pull origin main
            set -a && source .env && set +a
            $NODE_BIN/pnpm install --frozen-lockfile
            $NODE_BIN/npx prisma generate
            $NODE_BIN/npx prisma migrate deploy
            $NODE_BIN/pnpm build
            $NODE_BIN/pm2 restart vietnam-moto-tours
